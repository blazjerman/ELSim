name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, build, and browser UI checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check npm license inventory and direct dependency notices
        run: npm run check:npm-licenses

      - name: Run domain and netlist tests
        run: npm test

      - name: Build standard web distribution
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser UI regressions without the optional ngspice runtime
        run: npm run test:e2e:ui

      - name: Verify offline editing in the production preview
        run: npm run test:e2e:pwa

      - name: Install Firefox for Playwright
        run: npx playwright install --with-deps firefox

      - name: Run Firefox compatibility regressions
        run: npm run test:e2e:compat

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  engine-browsers:
    name: ngspice WASM parity and browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ELSim source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install ngspice build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y autoconf automake bison flex gperf libtool

      - name: Set up pinned Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      - name: Check out pinned ngspice source
        env:
          NGSPICE_SOURCE: ${{ runner.temp }}/ngspice
        run: |
          git clone https://git.code.sf.net/p/ngspice/ngspice "$NGSPICE_SOURCE"
          git -C "$NGSPICE_SOURCE" checkout --detach "$(cat engine/wasm/UPSTREAM_COMMIT)"

      - name: Build the local ngspice WASM runtime
        env:
          NGSPICE_SOURCE: ${{ runner.temp }}/ngspice
          JOBS: 2
        run: ./tools/build-ngspice-wasm.sh

      - name: Build native ngspice from the same source commit
        env:
          NGSPICE_SOURCE: ${{ runner.temp }}/ngspice
          NATIVE_BUILD: ${{ runner.temp }}/ngspice-native
        run: |
          mkdir -p "$NATIVE_BUILD"
          cd "$NATIVE_BUILD"
          "$NGSPICE_SOURCE/configure" \
            --disable-shared \
            --enable-static \
            --enable-xspice \
            --disable-cider \
            --disable-osdi \
            --disable-openmp \
            --disable-klu \
            --with-readline=no \
            --with-editline=no \
            --disable-debug \
            --without-x \
            CFLAGS=-O2 \
            LDFLAGS=-O2
          # Static parity build cannot link the optional Verilog/VHDL adapters.
          python3 "$GITHUB_WORKSPACE/tools/configure-ngspice-xspice-subdirs.py" \
            "$NATIVE_BUILD/src/xspice/Makefile"
          make -j2

      - name: Compare WASM fixtures with native ngspice
        env:
          NATIVE_NGSPICE: ${{ runner.temp }}/ngspice-native/src/ngspice
        run: node tools/test-ngspice-wasm.mjs public/engine "$NATIVE_NGSPICE"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run ngspice-backed Chromium workflows
        run: npm run test:e2e:engine

      - name: Run ngspice-backed Firefox workflows
        run: npm run test:e2e:engine:firefox

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ngspice-browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
